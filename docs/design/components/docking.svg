<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="ide-tool-header-fill" viewBox="0 0 1 32" preserveAspectRatio="none">
      <rect width="1" height="32" fill="#28343a"/>
    </symbol>
    <g id="ide-tool-header-accent"><rect width="3" height="32" fill="#edb77b"/></g>
    <g id="ide-tool-header-actions" fill="none" stroke="#a8b5bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <use href="#ide-icon-down"/><use href="#ide-icon-close" x="50"/>
    </g>
    <symbol id="ide-tab-strip" viewBox="0 0 1 36" preserveAspectRatio="none">
      <rect width="1" height="36" fill="#202b30"/>
